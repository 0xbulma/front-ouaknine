packages:
  - "apps/*"

# The dependencies the site and the studio genuinely share. The catalog is what
# stops them drifting onto two different 19.x behind a caret.
#
# styled-components is here for the same reason React is: the studio has always
# needed it, and the site now does too, as the peer @sanity/visual-editing
# declares. Neither imports it directly; both have to resolve the same one.
catalog:
  react: 19.2.8
  react-dom: 19.2.8
  styled-components: 6.5.3

# The studio's Vite toolchain. Nothing in the site needs a postinstall, so this
# stays an allowlist rather than a blanket `dangerouslyAllowAllBuilds`.
allowBuilds:
  "@parcel/watcher": true
  esbuild: true

# Security floors for transitive dependencies, from the Dependabot advisories.
# Each selector is scoped to the major its parents already ask for, so these
# only lift a patch or minor and never move a parent onto a new major. Most of
# them come in through the studio's Sanity CLI; drop one once its parent's own
# range has moved past the floor.
overrides:
  "adm-zip": ^0.6.1
  "brace-expansion@5": ^5.0.13
  "dompurify@3": ^3.4.18
  "js-yaml@3": ^3.15.2
  "markdown-it@14": ^14.3.3
  "sharp": ^0.35.5
  "smol-toml@1": ^1.9.1
  "undici@6": ^6.29.1
  "undici@7": ^7.30.2
  "undici@8": ^8.12.4
  "vite@8": ^8.3.8
  "zod@4": ^4.6.7
