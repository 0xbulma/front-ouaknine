name: CI

# Vercel runs `next build`, which typechecks but never lints and never runs the
# suite. Without this, `biome:check` / `lint` / `typecheck` / `test` only ever
# run on somebody's laptop.
#
# The build itself is Vercel's job and is not repeated here: it needs
# NEXT_PUBLIC_SANITY_ID to collect page data, and every page's getStaticProps
# would hit the CMS on every push.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit, not a tag: a tag can be moved.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # apps/studio/test/schema-parity.test.js reads the v2 baseline schema
          # out of git history, which a depth-1 checkout does not have.
          fetch-depth: 0

      # Reads `packageManager` from the root package.json, so the pnpm version
      # lives in one place too. Must come before setup-node, which needs pnpm
      # on PATH to resolve its cache directory.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # `engines.node` lives in the web app because that is where the Vercel
          # deploy reads it from, so pointing at it here keeps the version in one
          # place rather than drifting between the deploy and CI.
          node-version-file: apps/web/package.json
          cache: pnpm

      # One install for both workspaces: the root pnpm-lock.yaml covers them.
      - run: pnpm install --frozen-lockfile

      # One step, deliberately. Naming the workspaces here is what lets a third
      # one be added and never checked; `pnpm verify` is `pnpm -r verify` behind
      # the parity guard, so every workspace is covered by construction. What
      # each one runs is its own business: the site is Biome, ESLint, tsc and
      # Vitest, the studio is eslint-config-studio and node --test.
      - run: pnpm verify
