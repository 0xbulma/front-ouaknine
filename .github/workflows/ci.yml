name: CI

# Vercel runs `next build`, which typechecks but never lints and never runs the
# suite. Without this, `yarn biome:check` / `yarn lint` / `yarn typecheck` /
# `yarn test` only ever run on somebody's laptop.
#
# The build itself is Vercel's job and is not repeated here: it needs
# NEXT_PUBLIC_SANITY_ID to collect page data, and every page's getStaticProps
# would hit the CMS on every push.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit, not a tag: a tag can be moved.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Reads `engines.node` from package.json, so the version lives in one
          # place rather than drifting between here and the deploy.
          node-version-file: package.json
          cache: yarn

      - run: yarn install --frozen-lockfile

      # Formatting and the Biome rules first: it is the fastest of the four and
      # the one most likely to fail on an unformatted branch.
      - run: yarn biome:check

      # ESLint carries only the @next/next rules Biome has no equivalent for.
      - run: yarn lint

      - run: yarn typecheck

      - run: yarn test
